<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">When can you trust an expert's gut?</title>
  <desc id="d">A two by two grid. Intuition is trustworthy only when the environment is regular and the person had fast, clear feedback while learning.</desc>
  <rect width="800" height="450" rx="20" fill="#0f172a"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#f8fafc">When can you trust an expert's gut?</text>

  <text x="330" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#cbd5e1">Irregular, unpredictable world</text>
  <text x="600" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#cbd5e1">Regular, learnable world</text>

  <text x="125" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#cbd5e1">Fast, clear</text>
  <text x="125" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#cbd5e1">feedback</text>
  <text x="125" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#cbd5e1">Slow or missing</text>
  <text x="125" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#cbd5e1">feedback</text>

  <!-- top-left: caution -->
  <rect x="205" y="104" width="250" height="132" rx="14" fill="#713f12"/>
  <rect x="220" y="116" width="86" height="22" rx="11" fill="#fbbf24"/>
  <text x="263" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#451a03">CAUTION</text>
  <text x="330" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fef3c7">Feedback arrives, but</text>
  <text x="330" y="199" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fef3c7">the rules keep shifting</text>

  <!-- top-right: trustworthy -->
  <rect x="465" y="104" width="250" height="132" rx="14" fill="#065f46"/>
  <rect x="480" y="116" width="118" height="22" rx="11" fill="#34d399"/>
  <text x="539" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#022c22">TRUSTWORTHY</text>
  <text x="590" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#d1fae5">Real intuition can grow</text>
  <text x="590" y="199" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d1fae5">e.g. chess, firefighting</text>

  <!-- bottom-left: red flag -->
  <rect x="205" y="246" width="250" height="132" rx="14" fill="#7f1d1d"/>
  <rect x="220" y="258" width="86" height="22" rx="11" fill="#fb7185"/>
  <text x="263" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#4c0519">RED FLAG</text>
  <text x="330" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fee2e2">Confidence without skill</text>
  <text x="330" y="341" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#fee2e2">e.g. long-range forecasting</text>

  <!-- bottom-right: caution -->
  <rect x="465" y="246" width="250" height="132" rx="14" fill="#713f12"/>
  <rect x="480" y="258" width="86" height="22" rx="11" fill="#fbbf24"/>
  <text x="523" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#451a03">CAUTION</text>
  <text x="590" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fef3c7">Patterns exist, but you</text>
  <text x="590" y="341" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fef3c7">never get to learn them</text>

  <text x="400" y="423" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#94a3b8">Simplified from the two conditions in Kahneman &amp; Klein (2009).</text>
</svg>
