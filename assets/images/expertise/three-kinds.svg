<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Three ways to relate to a skill</title>
  <desc id="d">The Performer is steered by the audience, the Believer by their own belief, and the Seeker by reality.</desc>
  <rect width="900" height="430" rx="20" fill="#0f172a"/>
  <text x="450" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#f8fafc">Three ways to relate to a skill</text>
  <text x="450" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#94a3b8">What steers you: an audience, a belief, or reality?</text>

  <!-- Performer -->
  <rect x="40" y="92" width="260" height="300" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="170,104 128,180 212,180" fill="#fbbf24" opacity="0.25"/>
  <circle cx="170" cy="138" r="9" fill="#fbbf24"/>
  <ellipse cx="170" cy="164" rx="15" ry="12" fill="#fbbf24"/>
  <text x="170" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-weight="bold" fill="#fbbf24">The Performer</text>
  <text x="170" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#94a3b8">STEERED BY</text>
  <text x="170" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">The audience</text>
  <line x1="70" y1="278" x2="270" y2="278" stroke="#334155" stroke-width="2"/>
  <text x="170" y="304" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#e2e8f0">“Look impressive.”</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    <text x="170" y="334">Shows skill for others,</text>
    <text x="170" y="354">so growth stops where</text>
    <text x="170" y="374">the applause feels safe.</text>
  </g>

  <!-- Believer -->
  <rect x="320" y="92" width="260" height="300" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <ellipse cx="450" cy="142" rx="27" ry="36" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="450" cy="132" r="8" fill="#a78bfa"/>
  <ellipse cx="450" cy="156" rx="14" ry="10" fill="#a78bfa"/>
  <path d="M488 108 L488 124 M480 116 L496 116" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
  <text x="450" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-weight="bold" fill="#a78bfa">The Believer</text>
  <text x="450" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#94a3b8">STEERED BY</text>
  <text x="450" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">Their own belief</text>
  <line x1="350" y1="278" x2="550" y2="278" stroke="#334155" stroke-width="2"/>
  <text x="450" y="304" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#e2e8f0">“I feel I'm good at this.”</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    <text x="450" y="334">Feels skilled from within,</text>
    <text x="450" y="354">so average results get</text>
    <text x="450" y="374">explained away.</text>
  </g>

  <!-- Seeker -->
  <rect x="600" y="92" width="260" height="300" rx="16" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <circle cx="730" cy="142" r="32" fill="none" stroke="#2dd4bf" stroke-width="3"/>
  <circle cx="730" cy="142" r="19" fill="none" stroke="#2dd4bf" stroke-width="3"/>
  <circle cx="730" cy="142" r="5" fill="#2dd4bf"/>
  <path d="M764 108 L735 137" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
  <path d="M764 108 L764 120 M764 108 L752 108" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
  <text x="730" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-weight="bold" fill="#2dd4bf">The Seeker</text>
  <text x="730" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#94a3b8">STEERED BY</text>
  <text x="730" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">Reality</text>
  <line x1="630" y1="278" x2="830" y2="278" stroke="#334155" stroke-width="2"/>
  <text x="730" y="304" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#e2e8f0">“Does it actually work?”</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    <text x="730" y="334">Tests against results,</text>
    <text x="730" y="354">corrects mistakes and</text>
    <text x="730" y="374">builds real skill.</text>
  </g>

  <text x="450" y="416" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#94a3b8">A simple mental model, not a scientific classification. Most people move between the three.</text>
</svg>
