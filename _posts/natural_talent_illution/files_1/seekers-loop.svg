<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">How a Seeker builds real skill</title>
  <desc id="d">A loop of four steps: follow curiosity, practice weak spots, get real feedback, update and repeat.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="800" height="450" rx="20" fill="#0f172a"/>
  <text x="400" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#f8fafc">How a Seeker builds real skill</text>

  <rect x="40" y="100" width="300" height="86" rx="14" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <text x="60" y="134" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2dd4bf">1  Follow your curiosity</text>
  <text x="60" y="162" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">Interest gives you direction</text>

  <rect x="460" y="100" width="300" height="86" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="480" y="134" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#fbbf24">2  Practice weak spots</text>
  <text x="480" y="162" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">Focused, with a good teacher</text>

  <rect x="460" y="290" width="300" height="86" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="480" y="324" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#a78bfa">3  Get real feedback</text>
  <text x="480" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">Results, tests, honest outside eyes</text>

  <rect x="40" y="290" width="300" height="86" rx="14" fill="#1e293b" stroke="#fb7185" stroke-width="2"/>
  <text x="60" y="324" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#fb7185">4  Update and repeat</text>
  <text x="60" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">Change the method, not the facts</text>

  <line x1="346" y1="143" x2="454" y2="143" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="610" y1="190" x2="610" y2="284" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="454" y1="333" x2="346" y2="333" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="190" y1="286" x2="190" y2="192" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>

  <text x="400" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#e2e8f0">Repeat for years</text>
  <text x="400" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8">not weeks</text>

  <text x="400" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#94a3b8">Interest picks the direction. Feedback from the real world checks the result.</text>
</svg>
