<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Beginner versus master: separate pieces versus chunks</title>
  <desc id="d">A beginner sees twelve separate pieces. A master sees the same twelve pieces as three meaningful chunks.</desc>
  <rect width="800" height="370" rx="20" fill="#0f172a"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#f8fafc">Same board, different eyes</text>

  <text x="205" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#cbd5e1">Beginner</text>
  <text x="595" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#cbd5e1">Master</text>

  <rect x="30" y="100" width="350" height="200" rx="14" fill="#1e293b"/>
  <rect x="420" y="100" width="350" height="200" rx="14" fill="#1e293b"/>

  <g fill="#94a3b8">
    <circle cx="70" cy="140" r="13"/><circle cx="125" cy="185" r="13"/><circle cx="92" cy="240" r="13"/>
    <circle cx="170" cy="128" r="13"/><circle cx="205" cy="222" r="13"/><circle cx="252" cy="155" r="13"/>
    <circle cx="292" cy="248" r="13"/><circle cx="333" cy="130" r="13"/><circle cx="338" cy="195" r="13"/>
    <circle cx="150" cy="275" r="13"/><circle cx="248" cy="275" r="13"/><circle cx="62" cy="278" r="13"/>
  </g>

  <rect x="443" y="112" width="132" height="86" rx="28" fill="none" stroke="#2dd4bf" stroke-width="3"/>
  <g fill="#2dd4bf"><circle cx="470" cy="140" r="13"/><circle cx="515" cy="135" r="13"/><circle cx="482" cy="175" r="13"/><circle cx="540" cy="172" r="13"/></g>

  <rect x="600" y="112" width="150" height="86" rx="28" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <g fill="#fbbf24"><circle cx="630" cy="138" r="13"/><circle cx="675" cy="142" r="13"/><circle cx="645" cy="176" r="13"/><circle cx="722" cy="172" r="13"/></g>

  <rect x="520" y="208" width="150" height="80" rx="28" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <g fill="#a78bfa"><circle cx="550" cy="234" r="13"/><circle cx="595" cy="230" r="13"/><circle cx="565" cy="266" r="13"/><circle cx="642" cy="262" r="13"/></g>

  <text x="205" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e2e8f0">12 separate pieces to remember</text>
  <text x="595" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e2e8f0">3 meaningful chunks</text>
</svg>
