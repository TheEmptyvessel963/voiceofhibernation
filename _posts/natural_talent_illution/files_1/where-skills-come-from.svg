<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Where skills come from</title>
  <desc id="d">Genes give instincts and the ability to learn. Your own practice builds patterns. Teachers and culture pass knowledge between people.</desc>
  <rect width="900" height="400" rx="20" fill="#0f172a"/>
  <text x="450" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#f8fafc">Where do skills come from?</text>

  <!-- Genes -->
  <rect x="40" y="70" width="260" height="256" rx="16" fill="#1e293b" stroke="#fb7185" stroke-width="2"/>
  <text x="170" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#94a3b8">INHERITED</text>
  <text x="170" y="134" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#fb7185">Genes</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">
    <text x="170" y="170">Instincts and the ability</text>
    <text x="170" y="192">to learn. They do not</text>
    <text x="170" y="214">store finished knowledge.</text>
  </g>
  <rect x="62" y="252" width="216" height="46" rx="23" fill="#4c0519"/>
  <text x="170" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fda4af">EXAMPLE</text>
  <text x="170" y="288" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffe4e6">A cat covers its waste</text>

  <!-- Practice -->
  <rect x="320" y="70" width="260" height="256" rx="16" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#94a3b8">BUILT BY YOU</text>
  <text x="450" y="134" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2dd4bf">Your practice</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">
    <text x="450" y="170">Patterns stored in memory</text>
    <text x="450" y="192">through years of practice</text>
    <text x="450" y="214">and real feedback.</text>
  </g>
  <rect x="342" y="252" width="216" height="46" rx="23" fill="#042f2e"/>
  <text x="450" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5eead4">EXAMPLE</text>
  <text x="450" y="288" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ccfbf1">A master "sees" the move</text>

  <!-- Teachers -->
  <rect x="600" y="70" width="260" height="256" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="730" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#94a3b8">PASSED ON</text>
  <text x="730" y="134" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#a78bfa">Teachers</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">
    <text x="730" y="170">Know-how shared person</text>
    <text x="730" y="192">to person, through culture</text>
    <text x="730" y="214">and books.</text>
  </g>
  <rect x="622" y="252" width="216" height="46" rx="23" fill="#2e1065"/>
  <text x="730" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#c4b5fd">EXAMPLE</text>
  <text x="730" y="288" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ede9fe">Aristotle and Alexander</text>

  <text x="450" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e2e8f0">Instinct is slow and narrow. Learning is fast and flexible, but every person has to do it.</text>
</svg>
