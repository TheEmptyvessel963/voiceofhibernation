<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Schematic of the real versus random chess position finding</title>
  <desc id="d">Masters recall many more pieces than beginners from real game positions, but the advantage mostly disappears for random positions. Illustrative, not actual data.</desc>
  <rect width="800" height="390" rx="20" fill="#0f172a"/>
  <text x="400" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#f8fafc">Masters don't have a magic memory</text>

  <line x1="100" y1="90" x2="100" y2="300" stroke="#64748b" stroke-width="2"/>
  <line x1="100" y1="300" x2="740" y2="300" stroke="#64748b" stroke-width="2"/>
  <text x="34" y="195" transform="rotate(-90 34 195)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8">pieces recalled after a short look</text>

  <rect x="160" y="170" width="90" height="130" rx="6" fill="#94a3b8"/>
  <rect x="265" y="100" width="90" height="200" rx="6" fill="#2dd4bf"/>
  <text x="257" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e2e8f0">Real game positions</text>

  <rect x="475" y="225" width="90" height="75" rx="6" fill="#94a3b8"/>
  <rect x="580" y="212" width="90" height="88" rx="6" fill="#2dd4bf"/>
  <text x="572" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e2e8f0">Random positions</text>

  <rect x="560" y="66" width="14" height="14" rx="3" fill="#94a3b8"/>
  <text x="582" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">Beginner</text>
  <rect x="656" y="66" width="14" height="14" rx="3" fill="#2dd4bf"/>
  <text x="678" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">Master</text>

  <text x="400" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#94a3b8">Schematic of the pattern Chase &amp; Simon (1973) reported. Bar heights are illustrative, not real data.</text>
</svg>
